# Include inside your existing HTTPS server block, after configuring a valid certificate.
# Keep paths unchanged. No legacy service or state-based callback router is required.
location ^~ /charge/app/ {
    access_log off;
    proxy_pass http://127.0.0.1:5330;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 8k;
    proxy_read_timeout 90s;
}
location = /charge/auth/callback {
    access_log off;
    proxy_pass http://127.0.0.1:5330;
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
}
